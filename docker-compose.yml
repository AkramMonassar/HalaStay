services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: halastay
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: halastay
      DB_USERNAME: root
      DB_PASSWORD: secret
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      SANCTUM_TOKEN_EXPIRATION: 10080
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_storage: